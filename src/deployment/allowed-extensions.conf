# PodShift RPM payload allowlist
#
# Consumed by src/deployment/fn/deploy-files.sh to decide which files under
# src/server/ are copied into the RPM buildroot with mode 0644.
#
#   * Lines starting with '.'  -> allowed file EXTENSIONS
#     (the suffix after the last dot of the filename).
#   * Other non-empty lines    -> allowed exact BASENAMES of files that have
#     no extension.
#   * Blank lines and lines starting with '#' are ignored.
#
# Shell scripts (*.sh) are intentionally absent: they are deployed by
# deploy-sh-scripts.sh with mode 0755.

# Extensions
.conf
.md
.txt
.service
.path
.timer
.preset
.xml
.semanage
.local
.bashrc
.bash_profile

# Extensionless files
restorecon-dirs
