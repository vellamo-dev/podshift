# @file: expected-units.conf
# @source-dir: src/test/cli/tests/install-validate/data
# @description: PodShift systemd user units and whether each must be enabled.
# PodShift systemd user units and their expected enablement.
# Format: <unit> <enabled>   ("yes" = must be enabled via default.target.wants)
# All units are checked for file presence in /usr/lib/systemd/user/.

podshift-drop.path yes
podshift-drop.timer no
podshift-drop-debounce.service no
podshift-drop-process.service no
podshift-drop-safety.timer yes
podshift-qdl-validate.path yes
podshift-qdl-validate.service no
podshift-qdl-install.path yes
podshift-qdl-install.service no
