# @file: expected-steps.conf
# @source-dir: src/test/cli/tests/install-rpm/data
# @description: Install steps that the PodShift RPM scriptlets are expected to report.
# Expected install step tags (post and posttrans phases) for the PodShift RPM.
# Format: <tag> <kind> <description>
#   kind: step   = emits an [OK]/[WARN]/[SKIP] status
#         marker = header only, no status expected
# Lines starting with '#' are ignored.
# Update this list when post/posttrans scripts change.

PS-PO-0PO marker Preparing system (post)
PS-PO-DRS step   Creating directories for rootless podman
PS-PO-ENM step   Enabling and starting Network Manager
PS-PT-0PT marker Preparing system (posttrans)
PS-PT-DRC step   Deploying runtime config
PS-PT-FWD step   Configuring firewalld
PS-PT-SEL step   Updating SELinux
PS-PT-F2B step   Enabling fail2ban
PS-PT-PCP step   Enabling PCP metrics and Cockpit
PS-PT-KEY step   Creating SSH key pair for rootless podman
PS-PT-PRF step   Creating bash profile for podshift
PS-PT-PAF step   Creating podman authorization prerequisites
PS-PT-LNG step   Enabling user lingering for podshift
PS-PT-PMC step   Making podshift user rootless-podman compatible
PS-PT-OVR step   Installing podman auto-update override
PS-PT-USR step   Enabling and starting user services
PS-PT-SSP step   Configuring SSH ports
PS-PT-1PT marker PodShift version summary
