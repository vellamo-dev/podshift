# @file: tags.conf
# @source-dir: src/test/cli/tests/lint-bashdoc-tags/data
# @group: test
# @category: helper
# @description: Shared lists for the bashdoc tag lint suites: paths, required tags, conditional rules and exceptions.
# @license: AGPL-3.0-or-later
# @license-url: https://github.com/vellamo-dev/podshift/blob/main/LICENSE
# @author: Vellamo.fyi

# Sections below are read by lint-bashdoc-required-tags, lint-bashdoc-conditional-tags and lint-bashdoc-tag-values.
# Lines that are empty or start with # are ignored inside a section.
# A section starts with a line of the form: [name]

# Roots to scan for .sh files. Paths are relative to the project root.
[scan-paths]
src/server
src/deployment

# Tags every normal file must have exactly once in its file header.
[required-tags]
@file
@source-dir
@group
@category
@description
@license
@license-url
@author

# Tags allowed on a short-header file, in this order only.
[short-header-tags]
@file
@dest-dir
@description
@warning

# Files that use the short header (coding.md Short header table).
[short-header-files]
src/server/etc/profile.d/podshift.sh

# Files that must have no # @ tags (coding.md Exceptions). None yet.
[exception-files]

# PodShift .conf files that use bashdoc (or should). Foreign formats are left out on purpose:
# sysusers.d, tmpfiles.d, sysctl.d, systemd drop-ins, and assets/tpl templates for other tools.
[conf-files]
src/deployment/allowed-extensions.conf
src/server/opt/podshift/cli/aliases.conf
src/server/opt/podshift/cli/modules/health-check/groups.conf
src/server/opt/podshift/conf/main.conf
src/server/opt/podshift/conf/rootless.conf
src/server/opt/podshift/assets/quadlets-validator/patterns/pattern-container.conf
src/server/opt/podshift/assets/quadlets-validator/patterns/pattern-image.conf
src/server/opt/podshift/assets/quadlets-validator/patterns/pattern-network.conf
src/server/opt/podshift/assets/quadlets-validator/patterns/pattern-pod.conf
src/server/opt/podshift/assets/quadlets-validator/patterns/pattern-volume.conf

# Installed files that may use @host-edit: yes. All others under src/server must use no.
# Empty for now; host-editable files are templates under assets/tpl, which the lint skips.
[host-edit-yes]

# Directory = @step code prefix. Longest matching path wins.
# Files with @category: step under one of these paths must use this prefix.
[step-prefixes]
src/deployment=PS-DP
src/server/opt/podshift/rpm/post=PS-PO
src/server/opt/podshift/rpm/posttrans=PS-PT
src/server/opt/podshift/rpm/preun=PS-PR

# Entry scripts that carry @step. path=prefix.
[step-entry-files]
src/deployment/rpm-install.sh=PS-DP
src/server/opt/podshift/rpm/post.sh=PS-PO
src/server/opt/podshift/rpm/posttrans.sh=PS-PT
src/server/opt/podshift/rpm/preun.sh=PS-PR
src/server/opt/podshift/rpm/postun.sh=PS-PU

# Step files that live outside the rpm step folders. path=prefix.
# make-rootless-remote-key.sh stays in fn/rootless because podshift may call it later.
[step-outside-rpm]
src/server/opt/podshift/fn/rootless/make-rootless-remote-key.sh=PS-PT

# Allowed @run-as values for checks and CLI module main.sh files.
[run-as-values]
any
podshift
root
