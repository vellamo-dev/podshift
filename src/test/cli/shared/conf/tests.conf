# @description: Line width for readmes shown by run.sh --help.
TST_GLOW_WIDTH="${TST_GLOW_WIDTH:-120}"

# @description: Branch the spec builds from, read from its %global branch line. Gives the source tar <branch>.tar.gz with the folder podshift-<branch> inside, the same names GitHub uses.
TST_SOURCE_BRANCH="${TST_SOURCE_BRANCH:-$(sed -n 's/^%global branch //p' "${BASH_SOURCE[0]%/*}/../../../../../podshift.spec")}"

# @description: Fedora version the tests build for and install on.
TST_FEDORA_VERSION="${TST_FEDORA_VERSION:-45}"

# @description: Name of the RPM builder image, without its tag. The tag is the Fedora version.
TST_RPM_BUILDER_IMG="${TST_RPM_BUILDER_IMG:-ps-rpm-builder}"

# @description: Reuse an existing RPM builder image if it is new enough (true or false). ./test --fresh sets it to false.
TST_RPM_BUILDER_REUSE="${TST_RPM_BUILDER_REUSE:-true}"

# @description: Oldest RPM builder image that may be reused, in hours.
TST_RPM_BUILDER_MAX_AGE_HOURS="${TST_RPM_BUILDER_MAX_AGE_HOURS:-24}"

# @description: Build the RPM builder image without the build cache (true or false).
TST_RPM_BUILDER_NO_CACHE="${TST_RPM_BUILDER_NO_CACHE:-false}"

# @description: Name of the RPM builder container.
TST_RPM_BUILDER_CNT="${TST_RPM_BUILDER_CNT:-ps-rpm-builder-fc${TST_FEDORA_VERSION}}"

# @description: Host folder, relative to the repository root, that is mounted at /share in the RPM builder container. The built RPM is exported there.
TST_RPM_SHARE_DIR="${TST_RPM_SHARE_DIR:-artifacts/rpm}"

# @description: Name of the RPM installer VM image, without its tag. The tag is the Fedora version.
TST_RPM_INSTALLER_IMG="${TST_RPM_INSTALLER_IMG:-ps-rpm-installer}"

# @description: Reuse an existing RPM installer VM image if it is new enough (true or false). ./test --fresh sets it to false.
TST_RPM_INSTALLER_REUSE="${TST_RPM_INSTALLER_REUSE:-true}"

# @description: Oldest RPM installer VM image (the Fedora disk, or the Lima base VM on a Mac) that may be reused, in hours. One week by default.
TST_RPM_INSTALLER_MAX_AGE_HOURS="${TST_RPM_INSTALLER_MAX_AGE_HOURS:-168}"

# @description: Download the Fedora Server image again instead of reusing it (true or false). Fedora only; on a Mac, Lima keeps its own image cache.
TST_RPM_INSTALLER_NO_CACHE="${TST_RPM_INSTALLER_NO_CACHE:-false}"

# @description: Name of the RPM installer VM.
TST_RPM_INSTALLER_VM="${TST_RPM_INSTALLER_VM:-ps-rpm-installer-fc${TST_FEDORA_VERSION}}"

# @description: Number of CPUs for the RPM installer VM.
TST_RPM_INSTALLER_CPUS="${TST_RPM_INSTALLER_CPUS:-4}"

# @description: Memory for the RPM installer VM, for example 8G.
TST_RPM_INSTALLER_MEMORY="${TST_RPM_INSTALLER_MEMORY:-8G}"

# @description: How long to wait for systemd in the RPM installer VM to finish starting, in seconds.
TST_RPM_INSTALLER_BOOT_TIMEOUT="${TST_RPM_INSTALLER_BOOT_TIMEOUT:-180}"

# @description: Folder in the RPM installer VM that the RPM is copied to.
TST_RPM_INSTALLER_RPM_DIR="${TST_RPM_INSTALLER_RPM_DIR:-/root}"

# @description: UID the RPM gives the podshift user.
TST_PODSHIFT_UID="${TST_PODSHIFT_UID:-300}"

# @description: PodShift server folder in the repository, with the cli and shortcuts folders.
TST_PODSHIFT_DIR="${TST_PODSHIFT_DIR:-src/server/opt/podshift}"

# @description: Folder in the repository with the bats unit tests, one <function>.bats per file tagged @unit-test: yes.
TST_UNIT_DIR="${TST_UNIT_DIR:-src/test/unit}"

# @description: Minimum Bash major.minor for the test runner and for bash found on PATH (used by #!/usr/bin/env bash and bare bash children). Below this, no suite runs.
TST_BASH_MIN_VERSION="${TST_BASH_MIN_VERSION:-5.0}"

# @description: Maximum characters of one bashdoc @description tag.
TST_BASHDOC_DESC_MAX_CHARS="${TST_BASHDOC_DESC_MAX_CHARS:-120}"
