# @description: Oldest Apple container version the tests support.
TST_MIN_CONTAINER_VERSION="${TST_MIN_CONTAINER_VERSION:-1.5.0}"

# @description: Command that installs a missing host tool, used in Fix: lines.
TST_INSTALL_CMD="${TST_INSTALL_CMD:-brew install}"

# @description: Package that installs bats, used in the Fix: line of unit-pure-functions.
TST_BATS_PKG="${TST_BATS_PKG:-bats-core}"

# @description: Free disk space the tests need, in GB.
TST_MIN_DISK_GB="${TST_MIN_DISK_GB:-20}"

# @description: Lima config of the RPM installer VM, with the Fedora Cloud image and the first-boot script.
TST_LIMA_CONFIG="${TST_LIMA_CONFIG:-src/test/cli/os-specific/mac/lima/rpm-installer.yaml}"

# @description: Name of the stopped Lima base VM that the RPM installer VM is cloned from.
TST_RPM_INSTALLER_BASE="${TST_RPM_INSTALLER_BASE:-ps-rpm-installer-base-fc${TST_FEDORA_VERSION}}"

# @description: Fixed MAC address of the RPM installer VM, so it gets the same IP address on every run.
TST_VM_MAC="${TST_VM_MAC:-52:55:55:50:53:01}"

# @description: How long limactl start may take, for the base VM including the first-boot setup (dnf update and the server packages).
TST_LIMA_START_TIMEOUT="${TST_LIMA_START_TIMEOUT:-20m}"

# @description: SSH ports tried in this order. A fresh VM has 22; after PodShift is installed sshd listens on 22 and 1022.
TST_VM_SSH_PORTS="${TST_VM_SSH_PORTS:-1022 22}"
