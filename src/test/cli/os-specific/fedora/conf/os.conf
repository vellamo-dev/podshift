# @description: Command that installs a missing host tool, used in Fix: lines.
TST_INSTALL_CMD="${TST_INSTALL_CMD:-sudo dnf install}"

# @description: Package that installs bats, used in the Fix: line of unit-pure-functions.
TST_BATS_PKG="${TST_BATS_PKG:-bats}"

# @description: Free disk space the tests need, in GB.
TST_MIN_DISK_GB="${TST_MIN_DISK_GB:-20}"

# @description: Fedora Server image the RPM installer VM is built from.
TST_FEDORA_IMAGE_URL="${TST_FEDORA_IMAGE_URL:-https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Server/x86_64/images/Fedora-Server-Guest-Generic-45-1.4.x86_64.qcow2}"

# @description: Fedora's checksum file for TST_FEDORA_IMAGE_URL.
TST_FEDORA_CHECKSUM_URL="${TST_FEDORA_CHECKSUM_URL:-https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Server/x86_64/images/Fedora-Server-45-1.4-x86_64-CHECKSUM}"

# @description: Folder for the downloaded Fedora Server image and the RPM installer VM disk.
TST_VM_IMAGE_DIR="${TST_VM_IMAGE_DIR:-${HOME}/.cache/podshift-test}"

# @description: libvirt storage pool that the RPM installer VM disk is uploaded to.
TST_VM_POOL="${TST_VM_POOL:-default}"
# SSH ports tried in this order. A fresh VM has 22; after PodShift is installed sshd listens on 22 and 1022.
TST_VM_SSH_PORTS="${TST_VM_SSH_PORTS:-1022 22}"
