# @file: tsv-rules.conf
# @source-dir: src/server/opt/podshift/conf
# @dest-dir: /opt/podshift/conf
# @host-edit: no
# @group: config
# @category: config
# @description: Words and value formats that mark a custom TSV_* key as a secret, read by podshift config and the API.
# @license: AGPL-3.0-or-later
# @license-url: https://github.com/vellamo-dev/podshift/blob/main/LICENSE
# @author: Vellamo.fyi
#
# One rule per line: a kind, one space, then the rule. Empty lines and lines starting with # are ignored.
# word <WORD>       a whole word of the name, between _ characters, that marks a secret.
# key-after <WORD>  the word KEY right after this word marks a secret, for example TSV_API_KEY.
# value <regex>     an extended regular expression; a value that matches it is a secret.

word PASSWORD
word PASSWD
word PSW
word PSWD
word PWD
word PASS
word SECRET
word SECRETS
word TOKEN
word APIKEY
word CREDENTIAL
word CREDENTIALS
key-after API
key-after PRIVATE
value -----BEGIN ([[:upper:]]+ )*PRIVATE KEY-----
value (^|[^[:alnum:]_])gh[pousr]_[[:alnum:]]{36}([^[:alnum:]_]|$)
value (^|[^[:alnum:]_])github_pat_[[:alnum:]_]{22,}
value (^|[^[:alnum:]_])glpat-[[:alnum:]_-]{20,}
value (^|[^[:alnum:]_])xox[bp]-[[:digit:]]+-[[:alnum:]-]+
value (^|[^[:alnum:]])AKIA[[:upper:][:digit:]]{16}([^[:alnum:]]|$)
value (^|[^[:alnum:]_-])eyJ[[:alnum:]_-]{10,}\.[[:alnum:]_-]{10,}\.[[:alnum:]_-]+
