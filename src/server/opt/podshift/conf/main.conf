# @license-url: https://github.com/vellamo-dev/podshift/blob/main/LICENSE
# @author: Vellamo.fyi
#
# PodShift Configuration

# @description: Comma-separated list of supported environment tags.
# @group: env
# @type: list
export PODSHIFT_ENV_TYPES=development,dev,test,tst,snapshot,snap,staging,stg,production,prd,latest

# @description: Directory where users drop quadlet files and bundles.
# @group: ingest
export PODSHIFT_DROP_DIR="/home/podshift/drop"

# @description: Directory for files rejected by the preliminary inspection.
# @group: ingest
export PODSHIFT_TRASH_DIR="/home/podshift/trash"

# @description: How long a dropped file must stay unchanged before it is
#               considered complete and processed.
# @group: drop
# @type: seconds
export PODSHIFT_DROP_SETTLE=2

# @description: Maximum accepted size of a dropped .zip bundle.
# @group: drop
# @type: kilobytes
export PODSHIFT_DROP_MAX_BUNDLE_SIZE=50

# @description: Quadlet file extensions accepted in the drop directory.
# @group: drop
# @type: list
export PODSHIFT_DROP_QUADLET_EXTENSIONS=".container,.volume,.network,.image"

# @description: Root of the quadlet lifecycle directories.
# @group: quadlet
export PODSHIFT_QUADLET_ROOT_DIR="/home/podshift/.quadlets"

# @description: Quadlets waiting to be validated.
# @group: quadlet
export PODSHIFT_QUADLET_VALIDATION_QUEUE_DIR="/home/podshift/.quadlets/validation-queue"

# @description: Quadlets validated and ready for installation.
# @group: quadlet
export PODSHIFT_QUADLET_SOURCE_DIR="/home/podshift/.quadlets/source"

# @description: Quadlets rejected by the validator.
# @group: quadlet
export PODSHIFT_QUADLET_REJECTED_DIR="/home/podshift/.quadlets/rejected"

# @description: Source backup of quadlets that were installed successfully.
# @group: quadlet
export PODSHIFT_QUADLET_INSTALLED_BACKUP_DIR="/home/podshift/.quadlets/installed-backup"

# @description: Quadlets that failed to install.
# @group: quadlet
export PODSHIFT_QUADLET_FAILED_DIR="/home/podshift/.quadlets/failed"

# @description: Filled copies of quadlets used for the dry run and install, emptied on each run.
# @group: quadlet
export PODSHIFT_QUADLET_STAGING_DIR="/home/podshift/.quadlets/staging"

# @description: Directory where Podman installs generated quadlet units.
# @group: podman
export PODSHIFT_PODMAN_QUADLETS_DIR="/home/podshift/.config/containers/systemd"

# @description: Path to the runtime configuration file.
# @group: config
export PODSHIFT_RUNTIME_CONF="/var/lib/podshift/runtime.conf"

# @description: Flag file that marks a desktop install. When it is missing, the install type is server.
# @group: config
export PODSHIFT_DESKTOP_FLAG="/etc/podshift-desktop"

# @description: Directory of runtime configuration templates.
# @group: config
export PODSHIFT_RUNTIME_CONF_TEMPLATES="/opt/podshift/assets/tpl"

# @description: Comma-separated list of runtime config keys that only root may change.
# @group: config
# @type: list
export PODSHIFT_SYSTEM_CONFIG_KEYS="TSV_ENV,PODSHIFT_NW_INITIALIZER,PODSHIFT_NW_DEVICE"

# @description: Path to the podshift user's custom TSV_* variable file.
# @group: config
export PODSHIFT_TSV_CONF="/home/podshift/.config/podshift/tsv.conf"

# @description: Path to the rootless configuration file.
# @group: config
export PODSHIFT_ROOTLESS_CONF="/opt/podshift/conf/rootless.conf"

# @description: Minimum supported Fedora release.
# @group: platform
export PODSHIFT_MIN_FEDORA=45

# @description: Comma-separated image registries PodShift depends on.
# @group: network
# @type: list
export PODSHIFT_REGISTRIES="quay.io"
