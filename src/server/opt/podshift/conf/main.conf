# @file: main.conf
# @source-dir: src/server/opt/podshift/conf
# @dest-dir: /opt/podshift/conf
# @host-edit: no
# @group: config
# @category: config
# @description: Defines PodShift default paths, timeouts and environment tags that other scripts load and export.
