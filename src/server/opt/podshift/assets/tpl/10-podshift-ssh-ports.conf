# 10-podshift-ssh-ports.conf
#
# sshd always listens on port 22 and port 1022.
# Port 1022 only brings less noise in the logs. It is not a protection.
# The protection is the key-only login in 50-podshift-auth.conf and fail2ban.
#
# To close port 22 for the network, use: sudo podshift ssh port 1022
# That changes only the firewall (the ssh service), not this file.
Port 22
Port 1022
